name: Windows Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run the Release test suite"
        type: boolean
        default: true
      run_interactive_tests:
        description: >-
          Also run the UI tests labelled 'interactive'. These drive the real
          desktop and are unreliable on hosted runners.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine product version
        id: meta
        shell: pwsh
        run: |
          $version = "0.2.0"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
            if ($tag.StartsWith("v")) {
              $tag = $tag.Substring(1)
            }
            if ($tag -match '^(\d+)\.(\d+)\.(\d+)') {
              $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "msi_name=WORD1-windows-x64-$version.msi" >> $env:GITHUB_OUTPUT
          "zip_name=WORD1-windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Configure (Release)
        shell: pwsh
        working-directory: src
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build (Release)
        shell: pwsh
        working-directory: src
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cmake --build --preset x64-release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test (Release)
        id: tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_tests
        continue-on-error: true
        shell: pwsh
        working-directory: src
        env:
          RUN_INTERACTIVE_TESTS: ${{ inputs.run_interactive_tests }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $arguments = @(
            "--test-dir", "..\out", "-C", "Release", "--output-on-failure",
            "--timeout", "60"
          )
          if ($env:RUN_INTERACTIVE_TESTS -ne "true") {
            # The 'interactive' scenarios need a real desktop for synthetic
            # input and pixel readback, which hosted runners do not provide.
            Write-Host "Excluding tests labelled 'interactive'."
            $arguments += @("-LE", "interactive")
          }
          ctest @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check optional signing configuration
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
          }

      - name: Import signing certificate
        id: cert
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor `
                   [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:WINDOWS_CERT_PASSWORD, $flags)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "CurrentUser")
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($cert)
          $store.Close()
          "cert_path=$certPath" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Sign WORD1.exe
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          Set-AuthenticodeSignature -FilePath "$env:GITHUB_WORKSPACE\bin\WORD1.exe" -Certificate $cert -TimestampServer "https://timestamp.digicert.com" | Out-Null

      - name: Create EXE release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\artifacts" -Force | Out-Null
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\bin\*" -DestinationPath "$env:GITHUB_WORKSPACE\artifacts\${{ steps.meta.outputs.zip_name }}" -Force

      - name: Install WiX
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet tool install --global wix --version 4.0.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          wix build "$env:GITHUB_WORKSPACE\packaging\wix\msword.wxs" `
            -arch x64 `
            -d SourceDir="$env:GITHUB_WORKSPACE\bin" `
            -d ProductName="Microsoft Word for Windows 1.1a (x64 Port)" `
            -d ProductVersion="${{ steps.meta.outputs.version }}" `
            -o "$env:GITHUB_WORKSPACE\artifacts\${{ steps.meta.outputs.msi_name }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign MSI
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          Set-AuthenticodeSignature -FilePath "$env:GITHUB_WORKSPACE\artifacts\${{ steps.meta.outputs.msi_name }}" -Certificate $cert -TimestampServer "https://timestamp.digicert.com" | Out-Null

      - name: Remove signing certificate
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Remove-Item "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}" -Force -ErrorAction SilentlyContinue
          Remove-Item "${{ steps.cert.outputs.cert_path }}" -Force -ErrorAction SilentlyContinue

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            artifacts/${{ steps.meta.outputs.zip_name }}
            artifacts/${{ steps.meta.outputs.msi_name }}
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') && steps.tests.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ steps.meta.outputs.zip_name }}
            artifacts/${{ steps.meta.outputs.msi_name }}

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::error::The Release test suite failed. Build artifacts were still produced and uploaded to this run, but no release assets were published."
          exit 1
